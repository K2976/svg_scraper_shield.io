<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanitizer Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #fff; padding: 2rem; }
    h1 { margin-bottom: 1rem; }
    .test { margin-bottom: 0.5rem; padding: 0.5rem; border-radius: 4px; }
    .pass { background: #065f46; color: #a7f3d0; }
    .fail { background: #7f1d1d; color: #fecaca; }
    #summary { font-weight: bold; margin-bottom: 2rem; font-size: 1.2rem; }
    pre { background: #000; padding: 1rem; overflow-x: auto; font-size: 0.85rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>SVG Sanitizer Test Suite</h1>
  <div id="summary">Running tests...</div>
  <div id="results"></div>

  <!-- Include the sanitizer logic -->
  <script src="../sanitizer.js"></script>
  <!-- Run the tests -->
  <script src="sanitizer.test.js"></script>
</body>
</html>
